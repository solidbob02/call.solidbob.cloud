[pytest]
# fastapi/ 에서 실행한다:  cd fastapi && pytest
# pythonpath = . 로 hub·evaluation·core 가 최상위 패키지로 보인다 (main.py·.importlinter 와 같은 맥락).
# 테스트는 앱 안에 둔다: hub/tests/, evaluation/tests/, <스포크>/tests/. 루트 tests/ 는 main.py(합성 루트) 전용.
# 실제 DB·ES·외부 STT/LLM이 필요한 테스트는 @pytest.mark.integration으로 분리하고 기본 실행에서는 뺀다.
pythonpath = .
testpaths = tests hub evaluation
markers =
    integration: 실제 인프라(MySQL·Elasticsearch·외부 API)가 필요한 테스트
addopts = -m "not integration" -q
