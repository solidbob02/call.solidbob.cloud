# Requirement: B-2
#
# 로컬 개발용 Elasticsearch. 지식베이스 색인(w2-kb-index)과 하이브리드 검색(B-2)이 쓴다.
#
#   docker compose up -d elasticsearch
#   curl localhost:9200/_cluster/health
#   export ELASTICSEARCH_URL=http://localhost:9200
#   .venv/bin/python scripts/index_knowledge_base.py --to-es --layout single --recreate
#
# ⚠ 담당 경계 — 인프라는 정성윤 담당이다(`.claude/rules/rfp-harness.md` §2). 이 파일은
#   `ai/` 쪽에서 색인을 돌리려고 저장소 루트에 둔 **로컬 개발용**이다. 배포용 구성이
#   생기면 `infra/` 로 옮기는 것은 그쪽 판단에 맡긴다.
#
# ⚠ 보안 설정을 끈 채로 배포하지 않는다. 아래 `xpack.security.enabled=false` 는 로컬에서
#   인증서·비밀번호 없이 붙기 위한 것이다. 배포 환경은 `ELASTICSEARCH_API_KEY` 를 쓴다
#   (`.env.example` — 값은 커밋하지 않는다, SEC-2).

services:
  elasticsearch:
    # 클라이언트(ai/requirements.txt 의 elasticsearch==9.5.0)와 major·minor 를 맞춘다.
    # 어긋나면 클라이언트가 접속 자체를 거부한다.
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    container_name: callguard-es

    # nori 는 기본 이미지에 없다 — `analysis-nori` 플러그인을 설치해야 nori_tokenizer 가
    # 생긴다(설치 안 하면 인덱스 생성이 "Unknown tokenizer" 로 실패한다).
    # 커스텀 Dockerfile 대신 기동 시 설치로 처리해 파일을 하나로 유지했다. 대신 컨테이너를
    # 새로 만들 때마다 내려받으므로 네트워크가 필요하다 — 오프라인이 잦아지면 그때
    # Dockerfile 로 빼서 이미지에 굽는다.
    command: >
      bash -c "elasticsearch-plugin list | grep -q analysis-nori ||
               elasticsearch-plugin install --batch analysis-nori;
               exec /usr/local/bin/docker-entrypoint.sh elasticsearch"

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false      # 로컬 전용. 위 주석 참고
      - ES_JAVA_OPTS=-Xms512m -Xmx512m    # 지식베이스가 39KB 라 이 이상 필요 없다
      - ingest.geoip.downloader.enabled=false  # 기동할 때마다 DB 를 받으려다 실패 로그를 남긴다

    ports:
      - "9200:9200"

    volumes:
      - es-data:/usr/share/elasticsearch/data

    healthcheck:
      # 인덱스가 복제본 0개라 green 이다(number_of_replicas=0, es_index.build_settings).
      test: ["CMD-SHELL", "curl -fs localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 12          # 플러그인 설치가 붙어 첫 기동이 느리다
      start_period: 60s

volumes:
  es-data:
