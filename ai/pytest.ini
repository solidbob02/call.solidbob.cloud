[pytest]
# ai/ 에서 실행한다:  cd ai && pytest
#
# pythonpath 에 ../server/apps 가 들어 있는 이유:
#   evaluation 이 hub 의 포트·DTO(계약)를 import 한다. 계약은 server/ 가 정의하고
#   ai/ 가 구현·채점한다 — 의존 방향은 ai → server 한쪽뿐이다(.importlinter 계약 2).
#   구조가 아니라 경로 문제이므로 여기서 경로만 이어 준다.
pythonpath = . apps ../server/apps
# 테스트는 앱 안에 둔다: apps/<앱>/tests/. 루트 tests/ 는 합성 루트(스포크를 포트에
#   꽂는 배선) 전용이다 — 모듈끼리 직접 import 하지 않는다는 계약이 앱 안에서만 성립하므로,
#   두 모듈을 함께 보는 테스트는 계약 밖인 여기에 둔다.
testpaths = tests apps
markers =
    integration: 실제 인프라(Elasticsearch·GPU·외부 LLM API)가 필요한 테스트
    slow: 모델 로딩·학습이 들어가 오래 걸리는 테스트
addopts = -m "not integration and not slow" -q
