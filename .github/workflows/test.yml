name: CI — 하네스 테스트 · 구조 계약 · 사이트 빌드

# 회귀 방지용이다. "완성됐는가"가 아니라 "어제 되던 게 오늘도 되는가"를 본다.
# 4인이 여러 브랜치에서 병합하는 구조라, 누군가의 머지가 하네스를 깨도
# 자동으로 돌지 않으면 다음에 손으로 돌린 사람이 우연히 발견하게 된다.
#
# 범위를 좁게 유지한다:
#  - fastapi/requirements.txt 전체를 설치하지 않는다. torch·transformers 는 테스트가 쓰지 않는다.
#    테스트가 실제로 import 하는 것만 설치한다 (pytest · fastapi · httpx(TestClient) · import-linter).
#  - 기준선 미달 시 실패(기획서 6.2절)는 아직 넣지 않는다. 측정값이 없어서
#    무조건 실패하거나 가짜 기준선을 넣게 된다 — 절대 원칙 2번 위반.
#    2주차 잠정 베이스라인이 나온 뒤 별도로 붙인다.
#  - 실제 DB·ES·외부 API 가 필요한 테스트는 fastapi/pytest.ini 의 `-m "not integration"` 로 빠진다
#  - 구조 계약(import-linter 5종, docs/harness.md §1)은 테스트와 별개 step — 계층 위반은 테스트가 못 잡는다

on:
  push:
    branches: [main, PM, backend, ai, frontend]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 테스트 의존성 설치
        # 버전은 fastapi/requirements.txt 의 고정값과 같게 유지한다.
        run: pip install pytest==9.1.1 fastapi==0.141.1 httpx==0.28.1 import-linter==2.13

      - name: 테스트 실행
        run: pytest

      - name: 구조 계약 검사 (import-linter)
        run: PYTHONPATH=apps lint-imports --config .importlinter

  jekyll:
    # 사이트가 곧 산출물이다. main 에 머지되는 순간 배포되므로, 깨진 채로 들어가면
    # 그때서야 알게 된다. 머지 전에 빌드와 내부 링크를 확인한다.
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 루비 설치
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: jekyll

      - name: 사이트 빌드
        run: bundle exec jekyll build
        working-directory: jekyll

      - name: 내부 링크 검사
        # 파일 이름이나 소제목을 바꾸면 링크가 조용히 깨진다. 빌드는 통과하므로
        # 사람이 클릭해 보기 전까지 아무도 모른다. 로컬에서도 같은 명령으로 확인할 수 있다.
        run: python3 scripts/check_site_links.py jekyll/_site
