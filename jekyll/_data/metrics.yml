# 성능 수치의 단일 출처. 기준: 기획서 rev.4 6.1절 + rev.4 보완지시서(1~3).
# 규칙 (CLAUDE.md 4.4):
#   1) 실제로 실행해서 나온 값만 넣는다. 미측정은 null. 기획서의 예시 숫자를 옮겨 적지 않는다.
#   2) 측정값 한 건에는 value / measured_at / commit / command / n 이 모두 붙는다.
#   3) 여러 번 실행했으면 최저치를 기록한다 (기준선 고정 원칙).
#   4) C-5·F-2 의 절대 규칙은 1건이라도 뚫리면 실패다. 평균으로 평가하지 않는다.

updated: 2026-08-25

# ── 목표 기준선 (rev.4 6.1절) ─────────────────────────────────────
targets:
  retrieval:
    recall_at_5_clean: 0.70      # STT 오류 0%
    recall_at_5_err10: 0.60      # STT 오류 10%
    mrr: 0.55

  trigger:
    # 보완지시서 1: 허용 창 0~800ms → 0~1,500ms.
    # 침묵 기반 트리거는 무음 N(700~1,000ms)을 기다린 뒤 발동하므로 800ms 창에서는
    # 구조적으로 달성 불가능했다. 하한 0ms 는 rev.4 값을 유지한다(보완지시서 8절).
    window_ms_min: 0
    window_ms_max: 1500
    fire_precision: 0.85         # 허용 창 안에서 발동한 비율
    early_fire_rate: null        # 조기 발동 — 별도 집계, 목표 미설정
    late_fire_rate: null         # 지연 발동 — 별도 집계, 목표 미설정
    delay_distribution: "기록"   # 보완지시서 1: p50/p95 분포를 별도 기록

  generation:
    hallucinated_numbers_max: 5  # 150문항 기준 건수
    citation_rate: 1.00

  compliance:
    recall: 0.90                 # 누락이 오탐보다 위험 → 재현율 우선
    precision: 0.60

  masking:                       # C-5
    missed_count: 0              # P1~P7 패턴 누락 0건 — 절대 규칙
    over_masking_rate: "참고 기록"   # 목표 아님. 애매하면 가린다
    recall_curve: "기록"         # STT 오류율별 마스킹 재현율 곡선

  latency:
    internal_p95_ms: 1000        # 트리거 발동 → 카드 표시
    e2e_ms: "측정·기록"          # 발화 종료 → 카드 표시. 통제 밖 구간 포함, 목표 미설정
    first_token_ms: 500          # 생성 첫 토큰 (스트리밍)

  f2:                            # 조건부 착수 (7주차 체크포인트)
    closure_verdict_accuracy: 1.00   # 종결 요건 판정 — 절대 규칙
    evidence_retrieval: 0.90

  optional:                      # 여유 시. 미구현이면 N/A
    f3_repeat_link_recall: 0.95
    g2_resource_match: 0.95
    g2_closed_org_returned: 0

# ── 측정 불가 (rev.4 5.5절) ──────────────────────────────────────
# 검증할 수 없는 것을 검증한 것처럼 제시하지 않는다.
not_measurable:
  - "F-1 / G-1 탐지 성능 — 실제 고위험 통화 데이터 확보 불가"
  - "C-5 는 실제 통화의 개인정보 발화 패턴을 확보할 수 없어 P1~P7 목록으로 범위를 한정해 측정한다"
  - "F-2 판정 정확도 100% 는 '규칙 엔진이 명세대로 동작한다'는 뜻이며, 규정 해석의 정당성을 검증하지 않는다 (보완지시서 3)"
  - "4.2 오류 내성은 통제된 합성 오류 기반이며 실제 STT 오류 분포와 같지 않다"

