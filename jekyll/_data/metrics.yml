# 성능 수치의 단일 출처.
# 규칙 (CLAUDE.md 4.4):
#   1) 실제로 실행해서 나온 값만 넣는다. 미측정은 null. 기획서의 예시 숫자를 옮겨 적지 않는다.
#   2) 측정값 한 건에는 value / measured_at / commit / command / n 이 모두 붙는다.
#   3) 여러 번 실행했으면 최저치를 기록한다 (기준선 고정 원칙).
#   4) 포스트·문서는 숫자를 직접 쓰지 않고 site.data.metrics 를 참조한다.

updated: 2026-08-24

# ── 목표 기준선 (기획서 6.1). 이 값은 합의로만 바꾼다 ──────────────
targets:
  retrieval:
    recall_at_5_clean: 0.70      # STT 오류 0%
    recall_at_5_err10: 0.60      # STT 오류 10%
    mrr: 0.55
  trigger:
    fire_precision: 0.85         # 적절 시점 발동률
    false_fire_rate: 0.15        # 불필요 발동률 (이하)
  generation:
    hallucinated_numbers_max: 5  # 150문항 기준 건수
    citation_rate: 1.00
  compliance:
    recall: 0.90                 # 누락이 오탐보다 위험 → 재현율 우선
    precision: 0.60
  latency:
    p95_ms: 1000

# ── 실측값 ────────────────────────────────────────────────────────
# 아직 아무것도 측정하지 않았다. 채울 때 measured_at/commit/command/n 을 함께 채운다.
