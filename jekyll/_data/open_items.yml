- id: OI-07
  title: "V1 — AI Hub 데이터의 채널 구성 (2채널 스테레오 / 모노)"
  why: >-
    실무 콜센터는 대개 2채널로 화자가 물리 분리돼 diarization 이 불필요하다.
    모노면 화자 분리 정확도가 C-1~C-3 과 C-5 전체의 성능 상한선이 된다.
    모노일 경우 시연은 물리 2채널(브라우저 2대)로 우회하고 한계를 명시한다.
  blocks: [w3.diarization, w3.masking_regex]
  owner: 정성윤
  status: open
  opened: 2026-08-25

- id: OI-08
  title: "V2 — GPU 가용 여부 및 생성 폴백 전환 판단"
  why: >-
    상용 API 는 배제돼 있고 CPU 추론으로 첫 토큰 500ms 달성은 불확실하다.
    미확보 시 생성 없이 검색 스니펫만 표시하는 폴백 모드를 기본값으로 전환한다(보완지시서 2).
    6주차에 드러나면 대응할 시간이 없으므로 1주차에 확인한다.
  blocks: [w6.cards, w6.fallback, w7.cost]
  owner: 정성윤
  status: open
  opened: 2026-08-25

