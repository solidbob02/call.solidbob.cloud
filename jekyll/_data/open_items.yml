- id: OI-13
  title: 컴플라이언스 경고(C-1~C-4)를 어느 테이블에 저장할 것인가
  why: >-
    기획서 rev.4 3절 다이어그램에는 MySQL 테이블이 5종(call / transcript / recommendation /
    closure / eval_result)만 있어 경고를 담을 자리가 없다. 별도 테이블을 두는 방법과
    recommendation 에 통합하는 방법이 있다. D-4 공백 리포트가 "놓친 위반 표현"을 집계하려면
    경고 이력이 조회 가능한 형태로 남아야 하므로 1주차 스키마 확정 때 함께 정한다.
    정규화 검토 결과 별도 테이블(compliance_alert + compliance_rule)을 권고한다 —
    경고는 추천과 생명주기·카디널리티가 다르고, 통합하면 카드 없는 경고 행에 NULL 이 대량으로 생긴다.
    또한 권장 대체 표현(C-4)은 규칙에 종속되므로 규칙 마스터로 분리해야 3NF 를 만족한다.
  blocks: [w1.db_schema, w7.postcall]
  owner: 정성윤
  status: open
  opened: 2026-08-25
