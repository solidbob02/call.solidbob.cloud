- id: OI-11
  title: 침묵 임계값 N 결정 — 트리거 허용 창 검증
  why: >-
    허용 창을 0~1,500ms 로 넓혔으나(보완지시서 1), 실제 침묵 임계값 N 이 1,000ms 를 넘으면
    같은 문제가 재발한다. AI Hub 음성의 발화 간 간격 분포를 보고 N 을 정한 뒤
    "허용 창 상한 > N + 판정 지연"이 성립하는지 확인한다.
  blocks: [w3.trigger_v1]
  owner: 류준
  status: open
  opened: 2026-08-25

