  why: >-
    5인 분업을 전제로 계획이 잡혀 있었다. 인원이 다르면 모듈 우선순위와 8주 일정이 통째로 달라진다.
  blocks: []
  owner: user
  status: resolved
  opened: 2026-08-24
  resolved: 2026-08-25
  resolution: >-
    기획서 rev.4 로 3인 확정 — 정성윤(AWS·인프라) / 류준(백엔드·AI) / 장민석(앱·프론트엔드).
    골든셋 작성과 발표 자료는 3인 공동. 류준 부하 집중에 대한 완화 조치는 rev.4 7.2절에 고정됐다.

