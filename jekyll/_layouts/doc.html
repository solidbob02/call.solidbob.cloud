<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} | {{ site.title }}</title>
<style>
  :root{
    --fg:#111318;
    --muted:#6b7280;
    --border:#e5e7eb;
    --accent:#2f6fed;
    --bg:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  }
  header.site-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:1.25rem 2rem;
    border-bottom:1px solid var(--border);
  }
  header.site-header .site-name{ font-weight:700; font-size:1rem; color:var(--fg); text-decoration:none; }
  header.site-header nav a{ color:var(--fg); text-decoration:none; margin-left:1.75rem; font-size:0.9rem; }
  header.site-header nav a:hover{ color:var(--accent); }

  main{ max-width:860px; margin:0 auto; padding:3rem 1.5rem 4rem; }
  main h1{ font-size:1.9rem; font-weight:800; margin:0 0 2.5rem; }
  main h2{ color:var(--accent); font-size:1.05rem; font-weight:700; margin:2.25rem 0 0.75rem; padding-bottom:0.6rem; border-bottom:1px solid var(--border); }
  main h2:first-of-type{ margin-top:0; }
  main h3{ font-size:0.95rem; font-weight:700; margin:1.5rem 0 0.5rem; }
  main ol.subitems{ list-style:none; margin:0 0 1rem; padding:0; }
  main ol.subitems li{ display:flex; gap:0.6rem; padding:0.5rem 0; font-size:0.95rem; }
  main ol.subitems li .num{ color:var(--muted); flex-shrink:0; }
  main ol.subitems li a{ color:var(--fg); text-decoration:none; }
  main ol.subitems li a:hover{ color:var(--accent); text-decoration:underline; }
  main .back-link{ display:inline-block; margin-top:2.5rem; color:var(--accent); text-decoration:none; font-size:0.9rem; }
  main .back-link:hover{ text-decoration:underline; }

  main p, main table, main ul:not(.subitems), main ol:not(.subitems), main blockquote, main pre{ text-align:left; font-size:0.95rem; line-height:1.7; }
  main a{ color:var(--accent); }
  main hr{ border:none; border-top:1px solid var(--border); margin:2rem 0; }
  main table{ width:100%; border-collapse:collapse; margin:1rem 0; font-size:0.9rem; }
  main table th, main table td{ border:1px solid var(--border); padding:0.5rem 0.75rem; text-align:left; vertical-align:top; }
  main table td.nowrap{ white-space:nowrap; }
  main pre{ background:#f6f7f9; padding:1rem; overflow-x:auto; border-radius:6px; font-size:0.85rem; }
  main blockquote{ border-left:3px solid var(--border); margin:1rem 0; padding:0.25rem 1rem; color:var(--muted); }

  footer{
    border-top:1px solid var(--border);
    padding:2.5rem 2rem;
    display:grid;
    grid-template-columns:1.1fr 0.8fr 1.4fr;
    gap:2rem;
    font-size:0.85rem;
    color:var(--muted);
  }
  footer .col strong{ display:block; color:var(--fg); margin-bottom:0.5rem; }
  footer a{ color:var(--muted); text-decoration:none; }
  footer a:hover{ color:var(--accent); }
  @media (max-width:640px){ footer{ grid-template-columns:1fr; } }
</style>
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/toc/' | relative_url }}">목차</a>
      <a href="{{ '/kanban/' | relative_url }}">칸반</a>
      <a href="{{ '/progress/' | relative_url }}">개발 로그</a>
      <a href="{{ '/open-items/' | relative_url }}">미결 항목</a>
    </nav>
  </header>

  <main>
    <h1>{{ page.title }}</h1>
    {{ content }}
  </main>

  <footer>
    <div class="col">
      <strong>{{ site.title }}</strong>
      {{ site.description }}
    </div>
    <div class="col">
      <strong>SOLIDBOB</strong>
    </div>
    <div class="col">
      {{ site.description }}
    </div>
  </footer>
</body>
</html>
