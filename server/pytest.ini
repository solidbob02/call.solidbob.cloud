[pytest]
# server/ 에서 실행한다:  cd server && pytest
# pythonpath = apps 로 hub 가 최상위 패키지로 보인다 (main.py·.importlinter 와 같은 맥락). core 는 server/ 직속.
# 테스트는 앱 안에 둔다: apps/<앱>/tests/. 루트 tests/ 는 main.py(합성 루트) 전용.
# 실제 DB·외부 API가 필요한 테스트는 @pytest.mark.integration으로 분리하고 기본 실행에서는 뺀다.
pythonpath = . apps
testpaths = tests apps
markers =
    integration: 실제 인프라(MySQL·Elasticsearch·외부 API)가 필요한 테스트
addopts = -m "not integration" -q
